aid: at-home-doc
name: At-Home-Doc
description: At-Home-Doc (now branded MetaDoc) is a Qatar-based healthcare SuperApp
  operated by Medihealth Solutions (MOPH Licence No. 2066) offering round-the-clock
  virtual and in-person medical care. Patients book on-demand video consultations,
  in-network clinic appointments, or home doctor visits through the app, alongside
  pharmacy delivery, lab-at-home services, family insurance packages, and a Med Coins
  loyalty rewards program. The platform bundles Meta Doc (virtual clinics for
  practitioners), Meta Patient (a patient community), and Medi Shop into a single
  consumer healthcare experience delivered over iOS and Android. Surfaced as a
  500 Global portfolio company and enriched in the API Evangelist network; no public
  developer API, OpenAPI, SDK, or documentation surface is currently published.
